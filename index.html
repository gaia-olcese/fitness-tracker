<!-- Admin Dashboard Container / Modal Snippet -->
<div id="admin-panel" style="display:none; padding: 20px; background: var(--surface); border-radius: 12px; margin-top: 20px;">
  <h3>Admin User Management</h3>
  <div id="admin-user-list" style="margin-top: 15px;">
    <!-- Rendered dynamically by loadAdminUsers() -->
  </div>
</div>

<script>
async function loadAdminUsers() {
  const container = document.getElementById("admin-user-list");
  container.innerHTML = "<p>Loading users...</p>";

  try {
    const res = await fetch("https://fitlog-api.gaia-olcese.workers.dev/api/admin/users", {
      method: "GET",
      headers: {
        "X-Username": localStorage.getItem("fitlog_user"),
        "X-Password": localStorage.getItem("fitlog_pass")
      }
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to load users");

    let html = `
      <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
          <tr style="border-bottom: 1px solid var(--border);">
            <th style="padding: 8px;">Username</th>
            <th style="padding: 8px;">Display Name</th>
            <th style="padding: 8px;">Role</th>
            <th style="padding: 8px; text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody>
    `;

    data.users.forEach(u => {
      html = html + `
        <tr style="border-bottom: 1px solid var(--border);">
          <td style="padding: 8px;">${u.username}</td>
          <td style="padding: 8px;">${u.display_name || '-'}</td>
          <td style="padding: 8px;">${u.is_admin ? 'Admin' : 'User'}</td>
          <td style="padding: 8px; text-align: right;">
            <button onclick="editUserPrompt('${u.username}', '${u.display_name || ''}')" style="margin-right: 5px; padding: 4px 8px; cursor: pointer;">Edit</button>
            <button onclick="deleteUser('${u.username}')" style="padding: 4px 8px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
          </td>
        </tr>
      `;
    });

    html += `</tbody></table>`;
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = `<p style="color: red;">Error: ${err.message}</p>`;
  }
}

async function editUserPrompt(currentUsername, currentDisplayName) {
  const newUsername = prompt("Enter new username (or keep existing):", currentUsername);
  if (!newUsername) return;
  const newPassword = prompt("Enter new password (leave blank to keep current password):");
  const displayName = prompt("Enter new display name:", currentDisplayName);

  try {
    const res = await fetch("https://fitlog-api.gaia-olcese.workers.dev/api/admin/users", {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        "X-Username": localStorage.getItem("fitlog_user"),
        "X-Password": localStorage.getItem("fitlog_pass")
      },
      body: JSON.stringify({
        targetUsername: currentUsername,
        newUsername: newUsername.trim(),
        newPassword: newPassword ? newPassword : undefined,
        displayName: displayName !== null ? displayName.trim() : undefined
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to update user");

    alert("User updated successfully!");
    
    // If you changed your own username/password, update local storage cache too!
    if (currentUsername === localStorage.getItem("fitlog_user")) {
      localStorage.setItem("fitlog_user", newUsername.trim().toLowerCase());
      if (newPassword) {
        // Note: frontend stores raw password to send as header in this architecture
        localStorage.setItem("fitlog_pass", newPassword);
      }
    }

    loadAdminUsers();
  } catch (err) {
    alert("Error updating user: " + err.message);
  }
}

async function deleteUser(username) {
  if (!confirm(`Are you sure you want to delete user "${username}" and all their workout/nutrition data?`)) return;

  try {
    const res = await fetch(`https://fitlog-api.gaia-olcese.workers.dev/api/admin/users/${username}`, {
      method: "DELETE",
      headers: {
        "X-Username": localStorage.getItem("fitlog_user"),
        "X-Password": localStorage.getItem("fitlog_pass")
      }
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Failed to delete user");

    alert("User deleted successfully.");
    loadAdminUsers();
  } catch (err) {
    alert("Error deleting user: " + err.message);
  }
}
</script>
